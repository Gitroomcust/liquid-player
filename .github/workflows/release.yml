name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            script: dist:win
          - os: macos-latest
            platform: macos
            script: dist:mac
          - os: ubuntu-latest
            platform: linux
            script: dist:linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }} -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Replace previous releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for t in $(gh release list --limit 200 --json tagName -q '.[].tagName'); do
            gh release delete "$t" --cleanup-tag --yes
          done
      - name: Publish Windows release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          gh release create "v$V-windows" artifacts/windows/* \
            --target "$GITHUB_SHA" \
            --title "Liquid Player $V — Windows" \
            --notes "Установщик Windows — обычная установка. Portable — запуск без установки."
      - name: Publish macOS release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          gh release create "v$V-macos" artifacts/macos/* \
            --target "$GITHUB_SHA" \
            --title "Liquid Player $V — macOS" \
            --notes "ZIP — архив приложения, DMG — образ диска для установки (Intel и Apple Silicon). Сборка не подписана: нажмите правой кнопкой → «Открыть» или выполните \`xattr -cr\`. Захват системного звука — macOS 14.2+."
      - name: Publish Linux release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          gh release create "v$V-linux" artifacts/linux/* \
            --target "$GITHUB_SHA" \
            --title "Liquid Player $V — Linux" \
            --notes "AppImage — запуск без установки; DEB — пакет для Debian/Ubuntu; TAR.GZ — архив с приложением."
